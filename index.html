<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estudiá la ISO 31000:2018 para el examen: mapa, flashcards y preguntas." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◎</text></svg>" />
    <title>ISO 31000 — Estudio</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo. Claro por defecto;
      // oscuro solo si la persona lo eligió con el botón.
      try {
        if (localStorage.getItem("tema.elegido") === "oscuro") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
